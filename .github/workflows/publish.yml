name: Publish to npm

# Release-driven publishing: publishing a GitHub Release is the ONLY trigger.
#
# Why this exact trigger, and nothing else:
#   - npm's trusted-publisher validation matches the workflow FILE that runs
#     `npm publish` (the `job_workflow_ref` claim). npm's docs warn that
#     `workflow_call` / `workflow_dispatch` publishing can make that check
#     compare a *different* workflow name and fail confusingly, so this file
#     publishes only on `release: published`.
#   - `published` fires for pre-releases too; the publish step below routes a
#     prerelease version to the `next` dist-tag so it never becomes `latest`.
#
# FIRST PUBLISH OF A NEW PACKAGE (read before cutting a release):
#   npm cannot publish a package's INITIAL version with trusted publishing
#   (npm/cli#8544) - the package must already exist on npmjs.com before a
#   trusted publisher can be configured for it. @donbee/jev-mcp and
#   @donbee/cline-plugin-jev-percent are new here, so each must be published
#   ONCE by hand before this workflow can publish it:
#     1) npm publish --access public      (locally, signed in as the scope owner)
#     2) npmjs.com -> package -> Settings -> Trusted Publisher -> add this repo
#        and this workflow file
#   The preflight step below fails with this message instead of letting the
#   publish step die on an opaque 401/403 from the registry.
on:
  release:
    types: [published]

# `id-token: write` is what lets GitHub mint the OIDC token npm exchanges for a
# short-lived publish credential. There is deliberately NO NPM_TOKEN secret.
permissions:
  contents: read
  id-token: write

# Never let two releases publish concurrently.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Trusted publishing only supports cloud-hosted runners (not self-hosted).
    runs-on: ubuntu-latest
    # ONE release publishes all three artifacts. Each gets its own job so one
    # bad package cannot block the others (fail-fast: false), and each runs its
    # own verify + fresh-install smoke before its own `npm publish`.
    #
    # Version/tag scheme: all three packages share ONE version line, so the
    # release tag `vX.Y.Z` must equal every manifest's version. A package whose
    # version is already on npm is skipped (a release can re-run safely).
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: .
            required: >-
              hooks/PreToolUse.cjs
              cline-plugin.js
              mcp-server.js
              src/cli.js
              src/jev-client.js
              scripts/install-hook.mjs
              skills/jev-percentages/SKILL.md
              README.md
          - dir: packages/jev-mcp
            required: >-
              src/mcp-server.js
              src/cli.js
              src/jev-client.js
              src/jev-config.js
              README.md
              LICENSE
          - dir: packages/cline-plugin
            required: >-
              cline-plugin.js
              hooks/PreToolUse.cjs
              hooks/jev-hook-lib.cjs
              src/cli.js
              scripts/install-hook.mjs
              skills/jev-percentages/SKILL.md
              .clinerules
              README.md
    name: publish ${{ matrix.dir == '.' && 'root' || matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # NOTE: no `registry-url` here on purpose. setup-node writes an
          # `.npmrc` containing `_authToken=${NODE_AUTH_TOKEN}`, and npm only
          # falls back to OIDC when NO token is present. A blank token still
          # counts as present, so `registry-url` breaks trusted publishing.
          # npm defaults to the public registry anyway.
          package-manager-cache: false # never cache in release builds

      - name: Use a current npm (trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          node -e '
            const MIN = "11.5.1";
            const parse = (v) => String(v).split("-")[0].split(".").map(Number);
            const got = parse(process.argv[1]);
            const min = parse(MIN);
            let old = false;
            for (let i = 0; i < 3; i++) {
              const g = got[i] ?? 0;
              const m = min[i] ?? 0;
              if (g > m) break; // newer segment: new enough no matter what follows
              if (g < m) { old = true; break; }
            }
            if (old) {
              console.error(`npm ${process.argv[1]} is too old for npm trusted publishing (need >= ${MIN})`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} is new enough for trusted publishing`);
          ' "$(npm --version)"

      - name: Preflight - the package exists on npm and has a trusted publisher
        run: |
          PKG="$(node -p "require('./${{ matrix.dir }}/package.json').name")"
          if ! npm view "$PKG" version >/dev/null 2>&1; then
            echo "::error::$PKG is not on npm yet, so it cannot be published from this OIDC-only workflow."
            echo "::error::Publish it once by hand (npm publish --access public), then configure its trusted publisher on npmjs.com. See the comment at the top of this workflow."
            exit 1
          fi
          echo "$PKG exists on npm: $(npm view "$PKG" version)"

      - name: Install root dependencies
        if: matrix.dir == '.'
        run: npm ci

      - name: Verify the release tag matches this package's version
        run: |
          VERSION="$(node -p "require('./${{ matrix.dir }}/package.json').version")"
          PKG="$(node -p "require('./${{ matrix.dir }}/package.json').name")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' does not match $PKG version '$VERSION'"
            exit 1
          fi
          echo "$PKG@$VERSION"

      # Root `verify` is already chained across the three packages; a package job
      # verifies only itself.
      - name: Verify
        run: |
          if [ "${{ matrix.dir }}" = "." ]; then npm run verify; else npm --prefix "${{ matrix.dir }}" run verify; fi

      # Release hygiene (.clinerules): a brand-new install of THIS artifact must
      # work before it can be published. `npm run smoke` at the root chains all
      # three; each package job smokes only its own tarball.
      - name: Fresh-install smoke
        run: |
          if [ "${{ matrix.dir }}" = "." ]; then node scripts/smoke-fresh-install.mjs; else npm --prefix "${{ matrix.dir }}" run smoke; fi

      - name: Skip if this version is already published
        id: published
        run: |
          PKG="$(node -p "require('./${{ matrix.dir }}/package.json').name")"
          VERSION="$(node -p "require('./${{ matrix.dir }}/package.json').version")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG@$VERSION is already on npm - the verification above is the release check, skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert the tarball ships what we expect
        # Run inside the package: `npm pack <dir>` would be read as a git
        # shorthand spec, and `working-directory` is also what makes each
        # package's own `prepack` (hook-lib generation) run for its tarball.
        working-directory: ${{ matrix.dir }}
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            // npm <= 11 emits an ARRAY of pack entries; npm 12 keys them by
            // package name. Support both so the runner npm version is irrelevant.
            const data = require("/tmp/pack.json");
            const entry = Array.isArray(data) ? data[0] : data[Object.keys(data)[0]];
            const files = entry.files.map((f) => f.path);
            const required = process.argv[1].split(/\s+/).filter(Boolean);
            const missing = required.filter((p) => !files.includes(p));
            if (missing.length) { console.error("missing from tarball:", missing); process.exit(1); }
            console.log(`tarball ok: ${files.length} files`);
          ' '${{ matrix.required }}'

      - name: Publish to npm
        if: steps.published.outputs.already != 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "pre-release $VERSION -> dist-tag next"
            npm publish --provenance --access public --tag next
          else
            echo "stable $VERSION -> dist-tag latest"
            npm publish --provenance --access public
          fi
        # `--provenance` is passed explicitly even though trusted publishing is
        # documented to attach provenance automatically: in practice it is not
        # always automatic, and the flag is harmless. `--access public` is also
        # in each package's publishConfig; it is repeated so the first publish of
        # a scoped package cannot accidentally go out as restricted.
        #
        # Deliberately NO `env: NODE_AUTH_TOKEN:` block - see the setup-node note
        # above. With no token in the environment, npm uses OIDC.
